[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-connector-for-your-wealthsimple"
version = "0.10.3"
requires-python = ">=3.13"
description = "Self-hosted Wealthsimple portfolio connector (unofficial API)"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]

[project.optional-dependencies]
collector = ["curl-cffi==0.16.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"wealthsimple_connector.core" = ["queries/*.graphql"]
